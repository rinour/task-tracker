# ==============================================================================
# nginx/default.conf: Cấu hình Reverse Proxy, HTTPS, Security Headers & Giới hạn tần suất
# ==============================================================================

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# 1. Chuyển hướng toàn bộ lưu lượng HTTP (cổng 80) sang HTTPS (cổng 443)
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS chính thức
server {
  listen 443 ssl;
  http2 on;
  server_name localhost;
  server_tokens off;                         # ẩn phiên bản Nginx

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # HTTP Security Headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;" always;

  # Phục vụ tệp tĩnh Frontend
  root  /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Không công khai endpoint metrics cho người dùng bên ngoài (TC17)
  location = /metrics {
    return 404;
  }

  # Chuyển tiếp yêu cầu API sang backend Node.js
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
