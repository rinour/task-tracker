# ==============================================================================
# grafana/provisioning/datasources/datasources.yml: Cấu hình nguồn dữ liệu Grafana
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
